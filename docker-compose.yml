services:
  # Laravel Web Service & Queue Worker
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_whatsapp_microservice
    restart: always
    ports:
      - "8200:8000"
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
    depends_on:
      - redis
      - evolution

  # Redis for Queues
  redis:
    image: redis:alpine
    container_name: whatsapp_redis
    restart: always

  # Postgres Database for Evolution API (Required in v2 for stability and latest WhatsApp protocols)
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp_postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Evolution API Service
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: whatsapp_evolution_api
    restart: always
    ports:
      - "8800:8080"
    environment:
      # Evolution API basic configuration
      - SERVER_PORT=8080
      - DEL_INSTANCE_CLEANER=true
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - LANGUAGE=es
      # Database Configuration (PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@postgres:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
    depends_on:
      - postgres

volumes:
  evolution_data:
  postgres_data:
